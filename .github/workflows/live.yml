name: live-tick

# Fully serverless pool updater: no laptop anywhere. Each run is a
# self-sustaining window (GitHub skips most */5 cron firings): every loop
# iteration refreshes live/snapshot.json (ESPN schedule/lines + the private
# picks sheet, secrecy-filtered) and runs live/tick.py, sleeping precisely
# toward the next kickoff or reveal and re-dispatching a successor before
# the 6-hour job limit. The sleep-chain bridges gaps up to 24h, so one run
# started midweek carries through Monday night and the settle; crons are
# redundancy, not a dependency.

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "set by self-dispatch"
        required: false
        default: ""
  schedule:
    - cron: "7,27,47 13-23 * * *"
    - cron: "7,27,47 0-5 * * *"
    - cron: "37 6-12 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: live/requirements.txt
      - run: pip install --quiet -r live/requirements.txt
      - name: window loop
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          git config user.name "pool-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + 19800))   # 5.5h budget inside the 6h job limit
          chain() {
            for i in 1 2 3; do
              gh workflow run live.yml -f chain=1 && { echo "re-dispatched successor"; return 0; }
              sleep 20
            done
            echo "::error::could not dispatch successor run"
            return 1
          }
          while :; do
            # everything uncommitted here is machine-written and regenerated
            # below; discard it so a pull can never autostash-conflict and
            # leave conflict markers in snapshot.json (seen 2026-11-22)
            git checkout -q -- . || true
            git pull -q --rebase --autostash || true
            python live/snapshot_sheet.py || echo "::warning::snapshot refresh failed; ticking with the last good snapshot"
            NEXT=$(python live/tick.py --next)
            echo "next=${NEXT}s"
            if [ "$NEXT" -lt 0 ]; then echo "nothing pending; chain ends"; exit 0; fi
            if [ "$NEXT" -gt 0 ]; then
              if [ "$NEXT" -gt 86400 ]; then echo "next window ${NEXT}s away; chain ends"; exit 0; fi
              REM=$((END - SECONDS - 420))
              if [ "$NEXT" -le "$REM" ]; then sleep "$NEXT"; continue; fi
              # longer than this job's budget: sleep the budget out, THEN hand off
              [ "$REM" -gt 60 ] && sleep "$REM"
              chain; exit 0
            fi
            python live/tick.py
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -q -m "week $(python -c 'import json;print(json.load(open("data.json"))["week"])') update"
              for i in 1 2 3; do git push -q && break; git pull -q --rebase || exit 1; done
              CHANGED=1
            else
              CHANGED=0
            fi
            ACTIVE=$(python live/tick.py --active)
            if [ "$CHANGED" -eq 0 ] && [ "$ACTIVE" -eq 0 ]; then
              echo "no change, nothing live or imminent; chain ends"
              exit 0
            fi
            if [ $((SECONDS + 420)) -gt "$END" ]; then chain; exit 0; fi
            sleep 300
          done
